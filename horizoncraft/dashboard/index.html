<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HorizonCraft Memory</title>
<style>
:root{--bg:#f6f6f3;--fg:#1b1b1b;--muted:#6b6b6b;--card:#fff;--line:#e3e3de;--accent:#2f6f3e;--keep:#2f6f3e;--sum:#a06a00;--drop:#a33}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#eee;--muted:#999;--card:#1e1e1c;--line:#333;--accent:#6fbf7f;--keep:#6fbf7f;--sum:#e0b050;--drop:#e07070}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c b{display:block;font-size:1.8rem}.c span{color:var(--muted);font-size:.8rem}
#feed{max-height:420px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px}
.row{border-bottom:1px solid var(--line);padding:4px 0;overflow-wrap:anywhere}.op-keep{color:var(--keep)}.op-summarize{color:var(--sum)}.op-drop{color:var(--drop)}
svg{width:100%;height:160px}header{padding:12px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}#status{color:var(--muted)}
</style></head>
<body>
<header><b>HorizonCraft · memory panel</b>
  <input id="host" placeholder="tinybird host (optional)" size="22"><input id="token" placeholder="tinybird token (optional)" size="24" type="password">
  <input id="run" placeholder="run_id (optional)" size="10"><span id="status"></span></header>
<main>
  <section><h2>Counters</h2><div class="counters" id="counters"></div></section>
  <section><h2>Goal stack</h2><div id="goals" class="muted">TODO(event): read from latest checkpoint event payload.</div></section>
  <section><h2>Context size (tokens)</h2><svg id="chart" viewBox="0 0 300 160" preserveAspectRatio="none"></svg></section>
  <section style="grid-column:1/-1"><h2>Event / GC decision feed</h2><div id="feed"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)||''}catch{return ''}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
const qs = new URLSearchParams(location.search);
for (const k of ['host','token','run']) { $(k).value = qs.get(k) || store.get('hc_'+k) || ''; $(k).onchange = () => store.set('hc_'+k, $(k).value); }
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function pipe(name, params = {}) {
  const p = new URLSearchParams({ ...params, token: $('token').value });
  if ($('run').value) p.set('run_id', $('run').value);
  const r = await fetch(`${$('host').value.replace(/\/$/,'')}/v0/pipes/${name}.json?${p}`);
  if (!r.ok) throw new Error(`${name}: ${r.status}`);
  return (await r.json()).data;
}
function renderCounters(c = {}) {
  const items = [['switches','Switches'],['tickets_closed','Tickets closed'],['resumes','Resumes'],['gc_decisions','GC decisions'],['gc_dropped','Dropped'],['total_events','Events']];
  $('counters').innerHTML = items.map(([k,l]) => `<div class="c"><b>${c[k] ?? 0}</b><span>${l}</span></div>`).join('');
}
function renderFeed(rows) {
  $('feed').innerHTML = rows.map(r => {
    let p = {}; try { p = JSON.parse(r.payload) } catch {}
    const cls = r.type === 'gc_decision' ? 'op-' + p.op : '';
    return `<div class="row ${cls}">${esc(r.ts.slice(11,19))} [${esc(r.world)}] <b>${esc(r.type)}</b> ${esc(r.payload).slice(0,300)}</div>`;
  }).join('') || '<div class="row">No events yet.</div>';
  const cp = rows.find(r => r.type === 'checkpoint');
  if (cp) { try { const g = JSON.parse(cp.payload).goal_stack; if (g) $('goals').innerHTML = g.slice().reverse().map(x => `<div class="row">${esc(x.goal ?? JSON.stringify(x))}</div>`).join(''); } catch {} }
}
function renderChart(rows) {
  const pts = rows.slice().reverse(); const svg = $('chart');
  if (!pts.length) { svg.innerHTML = '<text x="10" y="80" fill="currentColor" font-size="12">no token data</text>'; return; }
  const val = p => +(p.tokens ?? p.tokens_max ?? 0);
  const max = Math.max(...pts.map(val), 1);
  const d = pts.map((p,i) => `${(i/(Math.max(pts.length-1,1)))*300},${155 - (val(p)/max)*145}`).join(' ');
  svg.innerHTML = `<polyline fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="${d}"/>
    <text x="4" y="12" fill="currentColor" font-size="11">max ${max}</text>`;
}
async function tickLocal() {
  const r = await fetch((qs.get('board') || 'http://localhost:3100') + '/state.json', { cache: 'no-store' }); const st = await r.json();
  renderCounters({ ...st.counters, gc_decisions: (st.counters.gc_kept || 0) + (st.counters.gc_dropped || 0), total_events: st.seq });
  const rows = st.event_log.slice().reverse().map(e => ({ ts: e.ts.replace('T', ' '), world: 'local', type: e.type, payload: e.summary }));
  $('feed').innerHTML = rows.map(r => `<div class="row ${r.type === 'gc_decision' ? 'op-' + r.payload.split(':')[0] : ''}">${esc(r.ts.slice(11,19))} <b>${esc(r.type)}</b> ${esc(r.payload)}</div>`).join('') || '<div class="row">No events yet.</div>';
  const inprog = Object.values(st.tickets).filter(t => t.status === 'in_progress');
  $('goals').innerHTML = inprog.map(t => `<div class="row">#${t.id} ${esc(t.title)} → <b>${esc(st.assets[t.id]?.stage || 'queued')}</b></div>`).join('') || '<div class="muted">idle</div>';
  renderChart((st.context_history || []).slice().reverse().map(h => ({ tokens: h })));   // renderChart expects newest-first
  $('status').textContent = 'local state · ' + new Date().toLocaleTimeString();
}
async function tickProxy() {   // Rawtree via the board's /analytics proxy (key stays server-side)
  const b = qs.get('board') || 'http://localhost:3100'; const run = $('run').value ? '?run_id=' + encodeURIComponent($('run').value) : '';
  const get = async n => { const r = await fetch(`${b}/analytics/${n}${run}`); if (!r.ok) throw new Error((await r.json()).error || r.status); return (await r.json()).data; };
  const [c, feed, ctx] = await Promise.all([get('counters'), get('recent_events'), get('context_tokens')]);
  renderCounters(c[0]); renderFeed(feed); renderChart(ctx); $('status').textContent = 'rawtree · ' + new Date().toLocaleTimeString();
}
async function tick() {
  if (!$('token').value) {
    if (qs.get('source') === 'local') { try { await tickLocal(); } catch (e) { $('status').textContent = 'local state unreachable: ' + e.message; } return; }
    try { await tickProxy(); } catch (e) { try { await tickLocal(); $('status').textContent += ' (rawtree unavailable: ' + e.message + ')'; } catch (e2) { $('status').textContent = 'no data: ' + e.message; } }
    return;
  }
  try {
    const [c, feed, ctx] = await Promise.all([pipe('counters'), pipe('recent_events', { limit: 100 }), pipe('context_tokens')]);
    renderCounters(c[0]); renderFeed(feed); renderChart(ctx);
    $('status').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) { $('status').textContent = 'error: ' + e.message; }
}
renderCounters(); tick(); setInterval(tick, 3000);
</script>
</body></html>
