<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HorizonCraft World</title>
<style>
:root{--bg:#0e1116;--fg:#eee}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
#hud{position:fixed;left:12px;top:12px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;max-width:340px;pointer-events:none}
#hud b{display:block;margin-bottom:4px}#hud .muted{opacity:.7}#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);cursor:pointer;font-size:18px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2f6f3e;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .3s}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><b>HorizonCraft world</b><div id="count">0 assets</div><div class="muted">WASD move · Space jump · E discover · Esc release</div><div id="near" class="muted"></div><div id="found" class="muted"></div><div id="live" class="muted"></div></div>
<div id="start">Click to enter the world</div><div id="toast"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87b6e0); scene.fog = new THREE.Fog(0x87b6e0, 80, 260);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500); camera.position.set(0, 1.7, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.1)); const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(40, 80, 20); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x5a9e4b })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
scene.add(new THREE.GridHelper(600, 60, 0x3d6f35, 0x3d6f35));
// a "lake" landmark so "near the lake" works from the start (matches landmarks in memory/state.js)
const lake = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshLambertMaterial({ color: 0x3a7bd5 })); lake.rotation.x = -Math.PI / 2; lake.position.set(30, 0.02, -20); scene.add(lake);

const controls = new PointerLockControls(camera, document.body);
document.getElementById('start').onclick = () => controls.lock();
controls.addEventListener('lock', () => document.getElementById('start').style.display = 'none');
controls.addEventListener('unlock', () => document.getElementById('start').style.display = 'grid');
const keys = {}; addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---- live signals: sky/fog by weather, rain particles, billboard with headline
const SKY = { clear: 0x87b6e0, cloudy: 0x9aa4ad, fog: 0xb8bcbf, rain: 0x6f7a85 };
const rainGeo = new THREE.BufferGeometry(); const rainN = 4000; const rp = new Float32Array(rainN * 3);
for (let i = 0; i < rainN; i++) { rp[i*3] = (Math.random()-.5)*160; rp[i*3+1] = Math.random()*60; rp[i*3+2] = (Math.random()-.5)*160; }
rainGeo.setAttribute('position', new THREE.BufferAttribute(rp, 3));
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xcfe3ff, size: 0.15, transparent: true, opacity: .7 })); rain.visible = false; scene.add(rain);
const bbCanvas = document.createElement('canvas'); bbCanvas.width = 1024; bbCanvas.height = 256; const bbTex = new THREE.CanvasTexture(bbCanvas);
const billboard = new THREE.Mesh(new THREE.PlaneGeometry(16, 4), new THREE.MeshBasicMaterial({ map: bbTex })); billboard.position.set(0, 5, -14); scene.add(billboard);
const post = new THREE.Mesh(new THREE.BoxGeometry(.4, 5, .4), new THREE.MeshLambertMaterial({ color: 0x553311 })); post.position.set(0, 1.5, -14); scene.add(post);
function drawBillboard(live) {
    const c = bbCanvas.getContext('2d'); c.fillStyle = '#111'; c.fillRect(0, 0, 1024, 256); c.fillStyle = '#fff'; c.font = 'bold 40px system-ui'; c.textAlign = 'center';
    c.fillText(live.headline?.value ? live.headline.value.slice(0, 60) : 'waiting for live data…', 512, 110);
    c.font = '30px system-ui'; c.fillStyle = '#9fd'; c.fillText(live.override ? `Weather: ${live.override.condition} (by request #${live.override.ticket_id})` : live.weather?.value ? `${live.location ? 'Your weather' : 'San Francisco'} now: ${live.weather.value}` : '', 512, 190); bbTex.needsUpdate = true;
}
let lastLiveJson = '';
function applyLive(live = {}) {
    const j = JSON.stringify(live); if (j === lastLiveJson) return; lastLiveJson = j;
    const cond = live.condition || 'clear'; const col = new THREE.Color(SKY[cond] || SKY.clear);
    scene.background = col; scene.fog = new THREE.Fog(col, cond === 'fog' ? 10 : 80, cond === 'fog' ? 60 : 260);
    rain.visible = cond === 'rain'; drawBillboard(live);
    document.getElementById('live').textContent = live.override ? `weather: ${cond} (set by ticket #${live.override.ticket_id}; real: ${live.real_condition || '?'})` : live.weather ? `live: ${cond}${live.temp_f != null ? ' ' + live.temp_f + '°F' : ''} · ${new Date(live.weather.ts).toLocaleTimeString()}` : '';
}
drawBillboard({});
const loader = new GLTFLoader(); const placed = new Map(); // id -> {group, asset}
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 3000); };
function addAsset(a) {
    loader.load(a.url, gltf => {
        const obj = gltf.scene;
        obj.traverse(m => { if (m.isMesh && !m.geometry.attributes.normal) m.geometry.computeVertexNormals(); });
        // normalize: base on the ground, height = a.size (world units), centered on x/z
        const box = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); box.getSize(size);
        const s = (a.size || 4) / Math.max(size.y, 1e-6); obj.scale.setScalar(s);
        box.setFromObject(obj); const c = new THREE.Vector3(); box.getCenter(c);
        obj.position.set(a.x - c.x, -box.min.y, a.z - c.z); obj.rotation.y = a.rotation || 0;
        const g = new THREE.Group(); g.add(obj); scene.add(g); placed.set(a.id, { group: g, asset: a });
        toast(`placed: ${a.name}`);
    }, undefined, e => console.warn('load failed', a.url, e));
}
async function sync() {
    try {
        const w = await (await fetch('/world.json', { cache: 'no-store' })).json();
        for (const a of w.assets || []) if (!placed.has(a.id)) addAsset(a);
        document.getElementById('count').textContent = `${(w.assets || []).length} assets · ${w.pending || 0} pending`;
        applyLive(w.live);
    } catch (e) { console.warn(e); }
}
sync(); setInterval(sync, 3000);
// share the player's location so the agent's weather feed follows them (browser asks permission)
navigator.geolocation?.getCurrentPosition(p => fetch('/api/location', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lat: p.coords.latitude, lon: p.coords.longitude }) }).then(() => toast('weather will follow your location')), () => {}, { timeout: 8000 });

const found = new Set(); let vy = 0, y = 1.7;
addEventListener('keydown', e => { if (e.code === 'Space' && y <= 1.71) vy = 7; if (e.code === 'KeyE' && nearestAsset && nearestDist < 15 && !found.has(nearestAsset.id)) { found.add(nearestAsset.id); toast(`discovered: ${nearestAsset.name}`); } });
let nearestAsset = null, nearestDist = 1e9;
const vel = new THREE.Vector3(); let last = performance.now();
renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min((now - last) / 1000, 0.1); last = now;
    if (controls.isLocked) {
        const speed = (keys.ShiftLeft ? 18 : 8) * dt;
        if (keys.KeyW) controls.moveForward(speed); if (keys.KeyS) controls.moveForward(-speed);
        if (keys.KeyA) controls.moveRight(-speed); if (keys.KeyD) controls.moveRight(speed);
        vy -= 20 * dt; y = Math.max(1.7, y + vy * dt); if (y === 1.7) vy = 0; camera.position.y = y;
        nearestAsset = null; nearestDist = 1e9;
        for (const { asset } of placed.values()) { const d = Math.hypot(asset.x - camera.position.x, asset.z - camera.position.z); if (d < nearestDist) { nearestDist = d; nearestAsset = asset; } }
        document.getElementById('near').textContent = nearestAsset && nearestDist < 15 ? `near: ${nearestAsset.name} (#${nearestAsset.ticket_id})${found.has(nearestAsset.id) ? '' : ' — press E to discover'}` : '';
        document.getElementById('found').textContent = placed.size ? `discovered ${found.size} / ${placed.size}` : '';
    }
    if (rain.visible) { rain.position.x = camera.position.x; rain.position.z = camera.position.z; const p = rainGeo.attributes.position.array; for (let i = 1; i < p.length; i += 3) { p[i] -= 25 * dt; if (p[i] < 0) p[i] = 60; } rainGeo.attributes.position.needsUpdate = true; }
    renderer.render(scene, camera);
});
</script></body></html>
