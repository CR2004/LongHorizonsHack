<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HorizonCraft World</title>
<style>
:root{--bg:#0e1116;--fg:#eee;--panel:rgba(12,14,18,.78);--line:rgba(255,255,255,.12);--accent:#6fbf7f;--user:#2f6f3e;--agent:#2b3a52}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;left:12px;top:12px;background:var(--panel);padding:8px 12px;border-radius:10px;max-width:300px;pointer-events:none;backdrop-filter:blur(6px)}
#hud b{display:block;margin-bottom:2px}.muted{opacity:.7}
#compass{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);padding:6px 12px;border-radius:999px;pointer-events:none;display:flex;gap:8px;align-items:center}
#arrow{display:inline-block;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:16px solid var(--accent);transform-origin:50% 60%}
#info{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:10px;pointer-events:none;display:none;text-align:center}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);cursor:pointer;font-size:18px;z-index:5}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--user);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none}
/* chat */
#chat{position:fixed;right:12px;top:12px;bottom:12px;width:min(360px,calc(100vw - 24px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);z-index:6}
#chat header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#chat header a{color:var(--accent);text-decoration:none;font-size:12px}
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 10px;border-radius:10px;line-height:1.35;overflow-wrap:anywhere}
.m.user{align-self:flex-end;background:var(--user)}.m.agent{align-self:flex-start;background:var(--agent)}
.m .who{font-size:11px;opacity:.7;margin-bottom:2px}.m .st{font-size:11px;opacity:.8;margin-top:3px}
.m.pending .st{color:#e0b050}.m.done .st{color:var(--accent)}.m.failed .st{color:#e07070}
#form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
#text{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--fg);font:inherit}
#send,#photoBtn{padding:0 12px;border-radius:8px;border:0;background:var(--accent);color:#000;font-weight:600;cursor:pointer}
#photoBtn{background:transparent;color:var(--fg);border:1px solid var(--line)}
#photoBtn.has{border-color:var(--accent);color:var(--accent)}
#chat.min{bottom:auto}#chat.min #msgs,#chat.min #form{display:none}
@media (max-width:700px){#chat{left:12px;top:auto;height:46vh;width:auto}#hud{max-width:200px;font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><b>HorizonCraft</b><div id="count">0 things</div><div id="found" class="muted"></div><div id="live" class="muted"></div><div class="muted">WASD · Space jump · E discover · G carry/drop · X remake · ⌫ remove · Esc = chat</div></div>
<div id="compass"><span id="arrow"></span><span id="target" class="muted">nothing to find yet</span></div>
<div id="info"></div>
<div id="start">Click to walk around (Esc to get back to the chat)</div><div id="toast"></div>
<div id="chat">
  <header><b>Ask the world builder</b><span><a href="/dashboard/" target="_blank">memory panel ↗</a> &nbsp; <a href="#" id="minBtn">hide</a></span></header>
  <div id="msgs"></div>
  <form id="form"><input id="text" placeholder="add a dragon near the lake · make it rain · news about mars" autocomplete="off"><button type="button" id="photoBtn" title="attach a selfie: you'll appear in the world">📷</button><input type="file" id="photo" accept="image/*" capture="user" hidden><button id="send" type="submit">Send</button></form>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const toast = m => { const t = $('toast'); t.textContent = m; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 3000); };

// ---------- scene ----------
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87b6e0); scene.fog = new THREE.Fog(0x87b6e0, 80, 260);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500); camera.position.set(0, 1.7, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.1)); const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(40, 80, 20); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x5a9e4b })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
scene.add(new THREE.GridHelper(600, 60, 0x3d6f35, 0x3d6f35));
const lake = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshLambertMaterial({ color: 0x3a7bd5 })); lake.rotation.x = -Math.PI / 2; lake.position.set(30, 0.02, -20); scene.add(lake);

// live signals: sky/fog by weather, rain particles, billboard with the headline
const SKY = { clear: 0x87b6e0, cloudy: 0x9aa4ad, fog: 0xb8bcbf, rain: 0x6f7a85 };
const rainN = 4000, rp = new Float32Array(rainN * 3);
for (let i = 0; i < rainN; i++) { rp[i*3] = (Math.random()-.5)*160; rp[i*3+1] = Math.random()*60; rp[i*3+2] = (Math.random()-.5)*160; }
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rp, 3));
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xcfe3ff, size: 0.15, transparent: true, opacity: .7 })); rain.visible = false; scene.add(rain);
const bbCanvas = document.createElement('canvas'); bbCanvas.width = 1024; bbCanvas.height = 256; const bbTex = new THREE.CanvasTexture(bbCanvas);
const billboard = new THREE.Mesh(new THREE.PlaneGeometry(16, 4), new THREE.MeshBasicMaterial({ map: bbTex })); billboard.position.set(0, 5, -14); scene.add(billboard);
const post = new THREE.Mesh(new THREE.BoxGeometry(.4, 5, .4), new THREE.MeshLambertMaterial({ color: 0x553311 })); post.position.set(0, 1.5, -14); scene.add(post);
function drawBillboard(live = {}) {
    const c = bbCanvas.getContext('2d'); c.fillStyle = '#111'; c.fillRect(0, 0, 1024, 256); c.fillStyle = '#fff'; c.font = 'bold 38px system-ui'; c.textAlign = 'center';
    const head = live.headline?.value ? live.headline.value.slice(0, 64) : 'waiting for live data…';
    c.fillText(head, 512, 100);
    c.font = '26px system-ui'; c.fillStyle = '#9fd';
    const w = live.override ? `Weather: ${live.override.condition} (by request)` : live.weather?.value ? `${live.location ? 'Your weather' : 'San Francisco'} now: ${live.weather.value}` : '';
    c.fillText(w, 512, 160);
    c.font = '20px system-ui'; c.fillStyle = '#aaa'; c.fillText(live.news_query ? `news about: ${live.news_query}` : 'top of Hacker News', 512, 215);
    bbTex.needsUpdate = true;
}
let liveNow = {}, lastLiveJson = '';
function applyLive(live = {}) {
    const j = JSON.stringify(live); if (j === lastLiveJson) return; lastLiveJson = j; liveNow = live;
    const cond = live.condition || 'clear'; const col = new THREE.Color(SKY[cond] || SKY.clear);
    scene.background = col; scene.fog = new THREE.Fog(col, cond === 'fog' ? 10 : 80, cond === 'fog' ? 60 : 260);
    rain.visible = cond === 'rain'; drawBillboard(live);
    $('live').textContent = live.override ? `weather: ${cond} (by request; real: ${live.real_condition || '?'})` : live.weather ? `live: ${cond}${live.temp_f != null ? ' ' + live.temp_f + '°F' : ''}` : '';
}
drawBillboard();

// ---------- assets ----------
const gltfLoader = new GLTFLoader(), objLoader = new OBJLoader(); const placed = new Map();
const tint = id => new THREE.Color().setHSL((Array.from(String(id)).reduce((h, c) => h + c.charCodeAt(0), 0) % 360) / 360, 0.45, 0.55);
function addAsset(a) {
    const isObj = /\.obj(\?|$)/i.test(a.url);
    const onLoad = loaded => {
        const obj = isObj ? loaded : loaded.scene;
        obj.traverse(m => {
            if (!m.isMesh) return;
            if (!m.geometry.attributes.normal) m.geometry.computeVertexNormals();
            const mats = Array.isArray(m.material) ? m.material : [m.material];
            if (isObj || mats.every(mt => !mt.map)) m.material = new THREE.MeshStandardMaterial({ color: tint(a.id), roughness: 0.8 });
        });
        const box = new THREE.Box3().setFromObject(obj); const size = new THREE.Vector3(); box.getSize(size);
        obj.scale.setScalar((a.size || 4) / Math.max(size.y, 1e-6));
        box.setFromObject(obj); const c = new THREE.Vector3(); box.getCenter(c);
        obj.position.set(a.x - c.x, -box.min.y, a.z - c.z); obj.rotation.y = a.rotation || 0;
        const g = new THREE.Group(); g.add(obj); scene.add(g); placed.set(a.id, { group: g, asset: a });
        toast(`appeared: ${a.name}`);
    };
    if (isObj) objLoader.load(a.url, onLoad, undefined, e => console.warn('load failed', a.url, e)); else gltfLoader.load(a.url, onLoad, undefined, e => console.warn('load failed', a.url, e));
}
async function syncWorld() {
    try {
        const w = await (await fetch('/world.json', { cache: 'no-store' })).json();
        const ids = new Set((w.assets || []).map(a => a.id));
        for (const a of w.assets || []) {
            if (!placed.has(a.id)) addAsset(a);
            else { const p = placed.get(a.id); if (p !== grabbed && (p.asset.x !== a.x || p.asset.z !== a.z)) { p.group.position.set(a.x - p.asset.x, 0, a.z - p.asset.z); } Object.assign(p.asset, { author: a.author, placed_at: a.placed_at }); }
        }
        for (const [id, p] of placed) if (!ids.has(id)) { scene.remove(p.group); placed.delete(id); found.delete(id); toast(`gone: ${p.asset.name}`); }
        $('count').textContent = `${(w.assets || []).length} things · ${w.pending || 0} being made`;
        applyLive(w.live);
    } catch (e) { console.warn(e); }
}

// ---------- chat (messages are tickets; agent replies are its comments) ----------
let lastChatJson = '', pendingPhoto = null;
async function syncChat() {
    try {
        const msgs = await (await fetch('/api/chat', { cache: 'no-store' })).json();
        const j = JSON.stringify(msgs); if (j === lastChatJson) return; lastChatJson = j;
        const box = $('msgs'); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
        box.innerHTML = msgs.map(m => `<div class="m ${m.role} ${m.state || ''}"><div class="who">${m.role === 'user' ? esc(m.author || 'someone') : 'world builder'} · ${esc(m.ts).slice(11, 16)}</div>${esc(m.text)}${m.state ? `<div class="st">${esc(m.stateText)}</div>` : ''}</div>`).join('');
        if (atBottom) box.scrollTop = box.scrollHeight;
    } catch (e) { console.warn(e); }
}
$('form').onsubmit = async e => {
    e.preventDefault();
    const text = $('text').value.trim(); if (!text) return;
    const fd = new FormData(); fd.append('title', text); fd.append('author', localStorage.getItem('hc_name') || 'visitor');
    if (pendingPhoto) fd.append('photo', pendingPhoto);
    $('text').value = ''; pendingPhoto = null; $('photoBtn').classList.remove('has');
    await fetch('/api/chat', { method: 'POST', body: fd }); syncChat();
};
$('photoBtn').onclick = () => $('photo').click();
$('photo').onchange = () => { pendingPhoto = $('photo').files[0] || null; $('photoBtn').classList.toggle('has', !!pendingPhoto); if (pendingPhoto) toast('photo attached: say who you are, e.g. "put me in the world, I\'m Sam"'); };
$('minBtn').onclick = e => { e.preventDefault(); $('chat').classList.toggle('min'); $('minBtn').textContent = $('chat').classList.contains('min') ? 'show' : 'hide'; };
try { if (!localStorage.getItem('hc_name')) { const n = prompt('Your name (shown next to your requests)?', 'visitor'); if (n) localStorage.setItem('hc_name', n.slice(0, 24)); } } catch {}

// ---------- controls / game ----------
const controls = new PointerLockControls(camera, renderer.domElement);
$('start').onclick = () => controls.lock();
controls.addEventListener('lock', () => $('start').style.display = 'none');
controls.addEventListener('unlock', () => { $('start').style.display = 'grid'; });
const keys = {}; addEventListener('keydown', e => { if (document.activeElement === $('text')) return; keys[e.code] = true; }); addEventListener('keyup', e => keys[e.code] = false);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const found = new Set(); let vy = 0, y = 1.7, nearestAsset = null, nearestDist = 1e9;
addEventListener('keydown', e => {
    if (document.activeElement === $('text')) return;
    if (e.code === 'Space' && y <= 1.71) vy = 7;
    if (e.code === 'KeyE' && nearestAsset && nearestDist < 15 && !found.has(nearestAsset.id)) { found.add(nearestAsset.id); toast(`discovered: ${nearestAsset.name} (+10)`); }
    // world editing: every action is a chat request, so it goes through the agent and shows on the memory panel
    if (e.code === 'KeyG') {
        if (grabbed) { const a = grabbed.asset; const x = Math.round(camera.position.x), z = Math.round(camera.position.z);
            a.x = x; a.z = z; grabbed = null; say(`move ${a.id} to ${x},${z}`); toast(`dropped ${a.name} here`); }
        else if (nearestAsset && nearestDist < 15) { grabbed = placed.get(nearestAsset.id); toast(`carrying ${nearestAsset.name}: walk, then G to drop`); }
    }
    if (e.code === 'KeyX' && nearestAsset && nearestDist < 15) { say(`remake ${nearestAsset.name}`); toast(`asked for a different ${nearestAsset.name}`); }
    if (e.code === 'Backspace' && nearestAsset && nearestDist < 15) { say(`remove ${nearestAsset.name}`); toast(`asked to remove ${nearestAsset.name}`); }
});
let grabbed = null;
async function say(text) { const fd = new FormData(); fd.append('title', text); fd.append('author', localStorage.getItem('hc_name') || 'visitor'); await fetch('/api/chat', { method: 'POST', body: fd }); syncChat(); }
navigator.geolocation?.getCurrentPosition(p => fetch('/api/location', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lat: p.coords.latitude, lon: p.coords.longitude }) }).then(() => toast('weather will follow your location')), () => {}, { timeout: 8000 });

syncWorld(); syncChat(); setInterval(syncWorld, 3000); setInterval(syncChat, 3000);
let last = performance.now();
renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min((now - last) / 1000, 0.1); last = now;
    if (controls.isLocked) {
        const cond = liveNow.condition; const speed = (keys.ShiftLeft ? 18 : 8) * (cond === 'rain' ? 0.6 : cond === 'fog' ? 0.8 : 1) * dt;   // weather changes how you move
        if (keys.KeyW) controls.moveForward(speed); if (keys.KeyS) controls.moveForward(-speed);
        if (keys.KeyA) controls.moveRight(-speed); if (keys.KeyD) controls.moveRight(speed);
        vy -= 20 * dt; y = Math.max(1.7, y + vy * dt); if (y === 1.7) vy = 0; camera.position.y = y;
    }
    // nearest thing + compass to the nearest undiscovered thing
    nearestAsset = null; nearestDist = 1e9; let target = null, td = 1e9;
    for (const { asset } of placed.values()) {
        const d = Math.hypot(asset.x - camera.position.x, asset.z - camera.position.z);
        if (d < nearestDist) { nearestDist = d; nearestAsset = asset; }
        if (!found.has(asset.id) && d < td) { td = d; target = asset; }
    }
    if (target) {
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
        const heading = Math.atan2(dir.x, -dir.z), bearing = Math.atan2(target.x - camera.position.x, -(target.z - camera.position.z));
        $('arrow').style.transform = `rotate(${(bearing - heading) * 180 / Math.PI}deg)`; $('target').textContent = `${target.name} · ${Math.round(td)}m`;
    } else { $('arrow').style.transform = 'rotate(0deg)'; $('target').textContent = placed.size ? 'all discovered' : 'nothing to find yet'; }
    const info = $('info');
    if (nearestAsset && nearestDist < 15) { info.style.display = 'block'; info.innerHTML = `<b>${esc(nearestAsset.name)}</b><div class="muted">asked for by ${esc(nearestAsset.author || 'someone')}${nearestAsset.placed_at ? ' at ' + esc(nearestAsset.placed_at).slice(11, 16) : ''}</div>${found.has(nearestAsset.id) ? '<div class="muted">discovered ✓</div>' : '<div>press <b>E</b> to discover</div>'}`; }
    else info.style.display = 'none';
    $('found').textContent = placed.size ? `score ${found.size * 10} · discovered ${found.size}/${placed.size}` : '';
    if (grabbed) { const dir = new THREE.Vector3(); camera.getWorldDirection(dir); grabbed.group.position.set(camera.position.x + dir.x * 4 - grabbed.asset.x, 0, camera.position.z + dir.z * 4 - grabbed.asset.z); }
    if (rain.visible) { rain.position.x = camera.position.x; rain.position.z = camera.position.z; const p = rainGeo.attributes.position.array; for (let i = 1; i < p.length; i += 3) { p[i] -= 25 * dt; if (p[i] < 0) p[i] = 60; } rainGeo.attributes.position.needsUpdate = true; }
    renderer.render(scene, camera);
});
</script></body></html>
